<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VUS-OS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--el:#111827;--card:rgba(17,24,39,.7);--hover:rgba(30,41,59,.8);--bd:rgba(51,65,85,.5);--bdh:rgba(74,222,128,.35);--fg:#f1f5f9;--mute:#94a3b8;--dim:#475569;--ac:#22c55e;--danger:#ef4444;--tb:56px;--font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);user-select:none}
input,select,button{font-family:var(--font)}
.gl{border-radius:25%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}

#boot{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .5s}
#boot.hide{opacity:0;pointer-events:none}
.logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--ac),#10b981);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;color:#000;box-shadow:0 0 40px rgba(34,197,94,.35)}
#bootTitle{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--mute)}
.track{width:260px;height:6px;border-radius:4px;background:var(--card);border:1px solid var(--bd);overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--ac),#10b981);transition:width 1.6s linear}

#desktop{position:fixed;inset:0 0 var(--tb) 0;overflow:hidden}
#icons{position:absolute;inset:0;padding:14px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,96px);grid-auto-columns:92px;gap:4px;align-content:start;justify-content:start}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:8px;cursor:pointer;text-align:center}
.icon:hover{background:rgba(255,255,255,.06);outline:1px solid var(--bdh)}
.lbl{font-size:11.5px;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

.win{position:absolute;min-width:300px;min-height:200px;background:var(--el);border:1px solid var(--bd);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.win.focus{border-color:var(--bdh)}
.win.min{display:none}
.win.max{top:0!important;left:0!important;width:100%!important;height:100%!important;border-radius:0}
.bar{height:42px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 8px 0 12px;background:var(--card);border-bottom:1px solid var(--bd);cursor:grab;touch-action:none}
.wt{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--mute);font-size:14px;cursor:pointer}
.bar button:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.bar button.x:hover{background:var(--danger);color:#fff}
.body{flex:1;min-height:0;position:relative;background:#000;overflow:hidden}
.body iframe{width:100%;height:100%;border:0;display:block}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:13px var(--mono);color:var(--dim);background:var(--el)}
.load.err{color:var(--danger)}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none}
.rs::after{content:'';position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim)}

#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);background:rgba(17,24,39,.85);backdrop-filter:blur(16px);border-top:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 10px;z-index:500}
#startBtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-weight:600;font-size:13px;cursor:pointer;flex-shrink:0}
#startBtn:hover{border-color:var(--bdh)}
.sep{width:1px;height:28px;background:var(--bd);flex-shrink:0}
.sys{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0}
.sys.store{background:rgba(139,92,246,.14)}.sys.settings{background:rgba(6,182,212,.14)}
.sys:hover{filter:brightness(1.4)}
#tasks{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.task{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:8px;background:var(--card);border:1px solid var(--bd);color:var(--mute);font-size:12.5px;font-weight:500;cursor:pointer;max-width:180px;flex-shrink:0}
.task span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0}
.task.active{border-color:var(--bdh);color:var(--fg);background:var(--hover)}
.task.active .dot{background:var(--ac)}
#clock{font:12.5px var(--mono);color:var(--mute);padding:0 8px;text-align:right;line-height:1.3;flex-shrink:0}

#start{position:fixed;left:10px;bottom:calc(var(--tb) + 8px);width:340px;max-width:calc(100% - 20px);max-height:60vh;background:var(--el);border:1px solid var(--bd);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.5);z-index:600;display:none;flex-direction:column;overflow:hidden}
#start.open{display:flex}
#startList{overflow-y:auto;padding:8px}
.item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;cursor:pointer}
.item:hover{background:rgba(255,255,255,.06)}
.item b{display:block;font-size:13px}
.item small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pad{height:100%;overflow-y:auto;padding:18px 22px;background:var(--el);display:flex;flex-direction:column;gap:12px}
.pad h2{font-size:18px}
.pad label{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13.5px;font-weight:600;padding:10px 0;border-bottom:1px solid var(--bd)}
.pad input,.pad select{background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;color:var(--fg);font-size:12.5px;outline:none}
.pad input:focus,.pad select:focus{border-color:var(--ac)}
.pad label input[type=text]{width:200px}
.tabs{display:flex;gap:6px}
.tabs button{padding:6px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--mute);font-size:12px;font-weight:600;cursor:pointer}
.tabs button.on{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.35);color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;align-content:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card div{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.card p{font-size:11.5px;color:var(--mute);line-height:1.4}
.card button{align-self:flex-start;padding:6px 12px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--mute);font-size:11.5px;font-weight:600;cursor:pointer}
.card button.on{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.35);color:var(--ac)}

#ctx{position:fixed;z-index:900;min-width:180px;background:var(--el);border:1px solid var(--bd);border-radius:10px;padding:6px;display:none;box-shadow:0 16px 40px rgba(0,0,0,.5)}
#ctx div{padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer}
#ctx div:hover{background:rgba(255,255,255,.07)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
</style>
</head>
<body>
<div id="boot"><div class="logo">V</div><div id="bootTitle">VUS-OS</div><div class="track"><div id="fill"></div></div></div>
<div id="desktop"><div id="icons"></div></div>
<div id="start"><div style="padding:12px;border-bottom:1px solid var(--bd)" class="pad"><input id="startQ" placeholder="Search apps..." autocomplete="off"></div><div id="startList"></div></div>
<div id="ctx"></div>
<div id="taskbar">
  <button id="startBtn"><span class="gl" style="width:22px;height:22px;font-size:12px;background:linear-gradient(135deg,#22c55e,#10b981);color:#000">V</span>Start</button>
  <div class="sep"></div><div id="sys" style="display:flex;gap:6px"></div><div class="sep"></div>
  <div id="tasks"></div>
  <div id="clock">--:--</div>
</div>

<script>
// ===================== CONFIG =====================
const APPS_JSON = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS/refs/heads/main/apps.json";
const OS_REPO   = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS-OS/refs/heads/main/";

// Native apps: a .js file that does `export default { open(root, os) {...} }`.
// Point "url" at any raw link; update the link here when you edit an app.
const NATIVE = [
  { name: "Notes", url: OS_REPO + "apps/notes.js", desc: "Text files and code editor", icon: "📝", color: "amber", category: "tools", type: "native" }
];
const SEED = ["Notes", "VUS Launcher"]; // installed on first run

// ===================== HELPERS =====================
const $ = s => document.querySelector(s);
const LS = (k, d) => { try { const v = JSON.parse(localStorage.getItem("vos2_" + k)); return v ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem("vos2_" + k, JSON.stringify(v));
const esc = s => (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const key = a => a.name + "|" + a.url;
const isNative = a => a.type === "native" || /\.js(\?|$)/.test(a.url || "");
const COLORS = { green:["34,197,94","#4ade80"], blue:["59,130,246","#60a5fa"], amber:["245,158,11","#fbbf24"], rose:["244,63,94","#fb7185"], violet:["139,92,246","#a78bfa"], cyan:["6,182,212","#22d3ee"], lime:["132,204,22","#a3e635"], orange:["249,115,22","#fb923c"], red:["239,68,68","#f87171"], purple:["168,85,247","#c084fc"], black:["148,163,184","#cbd5e1"], white:["255,255,255","#f1f5f9"] };
const glyph = (a, s = 42) => { const [c, f] = COLORS[a.color] || COLORS.green; return `<div class="gl" style="width:${s}px;height:${s}px;font-size:${Math.round(s * .4)}px;background:rgba(${c},.18);color:${f}">${esc(a.icon || a.name.slice(0, 2).toUpperCase())}</div>`; };

// ===================== CATALOG (apps + tools only) =====================
let catalog = [...NATIVE];

function loadCatalog() {
  return fetch(APPS_JSON).then(r => r.json()).then(d => {
    ["apps", "tools"].forEach(cat => (d[cat] || []).forEach(a => {
      if (!a.name || !a.url || catalog.some(c => c.name === a.name)) return; // native versions win by name
      catalog.push({ ...a, category: cat });
    }));
  }).catch(e => console.error("apps.json failed", e));
}

// ===================== INSTALLED =====================
const installed = () => LS("installed", []);
const isInstalled = a => installed().includes(key(a));
function toggleInstall(a) {
  let list = installed();
  list = list.includes(key(a)) ? list.filter(k => k !== key(a)) : [...list, key(a)];
  save("installed", list);
  renderIcons();
}
function renderIcons() {
  const box = $("#icons"); box.innerHTML = "";
  installed().map(k => catalog.find(a => key(a) === k)).filter(Boolean).forEach(a => {
    const el = document.createElement("div");
    el.className = "icon";
    el.innerHTML = glyph(a) + `<div class="lbl">${esc(a.name)}</div>`;
    el.onclick = () => openApp(a);
    el.oncontextmenu = e => { e.preventDefault(); ctx(e, [["Remove from desktop", () => toggleInstall(a)]]); };
    box.appendChild(el);
  });
}

// ===================== CONTEXT MENU =====================
function ctx(e, items) {
  const m = $("#ctx");
  m.innerHTML = "";
  items.forEach(([label, fn]) => { const d = document.createElement("div"); d.textContent = label; d.onclick = () => { fn(); m.style.display = "none"; }; m.appendChild(d); });
  m.style.left = Math.min(e.clientX, innerWidth - 200) + "px";
  m.style.top = Math.min(e.clientY, innerHeight - 80) + "px";
  m.style.display = "block";
}
document.addEventListener("click", () => $("#ctx").style.display = "none");

// ===================== WINDOWS =====================
let z = 10, n = 0;
const wins = new Map();

function openApp(app) {
  const ex = app.single && [...wins.values()].find(w => w.app === app);
  if (ex) return toggle(ex.id);
  if (!app.builtin && !isNative(app) && !/raw\.githubusercontent\.com/.test(app.url)) {
    window.open(app.url, "_blank", "noopener"); return; // external sites open in a new tab
  }
  const id = "w" + (++n), el = document.createElement("div");
  const o = (n % 8) * 26;
  el.className = "win"; el.id = id;
  Object.assign(el.style, { width: Math.min(760, innerWidth - 40) + "px", height: Math.min(520, innerHeight - 120) + "px", left: 20 + o + "px", top: 20 + o + "px" });
  el.innerHTML = `<div class="bar">${glyph(app, 22)}<div class="wt">${esc(app.name)}</div><button data-a="min">—</button><button data-a="max">▢</button><button data-a="x" class="x">✕</button></div><div class="body"><div class="load">Loading ${esc(app.name)}...</div></div><div class="rs"></div>`;
  $("#desktop").appendChild(el);

  const task = document.createElement("div");
  task.className = "task";
  task.innerHTML = `<span class="dot"></span><span>${esc(app.name)}</span>`;
  task.onclick = () => toggle(id);
  $("#tasks").appendChild(task);
  wins.set(id, { id, app, el, task });

  const bar = el.querySelector(".bar");
  bar.onclick = e => {
    const a = e.target.dataset.a;
    if (a === "min") { el.classList.add("min"); task.classList.remove("active"); }
    if (a === "max") el.classList.toggle("max");
    if (a === "x") closeWin(id);
  };
  bar.ondblclick = e => { if (!e.target.closest("button")) el.classList.toggle("max"); };
  bar.onpointerdown = e => {
    if (e.target.closest("button") || el.classList.contains("max")) return;
    const sx = e.clientX, sy = e.clientY, l = el.offsetLeft, t = el.offsetTop;
    bar.setPointerCapture(e.pointerId);
    bar.onpointermove = ev => { el.style.left = l + ev.clientX - sx + "px"; el.style.top = Math.max(0, t + ev.clientY - sy) + "px"; };
    bar.onpointerup = () => { bar.onpointermove = bar.onpointerup = null; };
  };
  const rs = el.querySelector(".rs");
  rs.onpointerdown = e => {
    const sx = e.clientX, sy = e.clientY, w = el.offsetWidth, h = el.offsetHeight;
    rs.setPointerCapture(e.pointerId);
    rs.onpointermove = ev => { el.style.width = Math.max(300, w + ev.clientX - sx) + "px"; el.style.height = Math.max(200, h + ev.clientY - sy) + "px"; };
    rs.onpointerup = () => { rs.onpointermove = rs.onpointerup = null; };
  };
  el.addEventListener("pointerdown", () => focus(id), true);
  focus(id);
  load(app, el.querySelector(".body"), el);
}

function focus(id) {
  wins.forEach(w => { w.el.classList.toggle("focus", w.id === id); w.task.classList.toggle("active", w.id === id); });
  wins.get(id).el.style.zIndex = ++z;
}
function toggle(id) {
  const w = wins.get(id);
  if (w.el.classList.contains("min")) { w.el.classList.remove("min"); focus(id); }
  else if (+w.el.style.zIndex === z) { w.el.classList.add("min"); w.task.classList.remove("active"); }
  else focus(id);
}
function closeWin(id) {
  const w = wins.get(id); if (!w) return;
  w.el.remove(); w.task.remove(); wins.delete(id);
}

// What a native app receives as its second argument.
function makeOS(app, win) {
  return {
    storage: { get: (k, d) => LS("app_" + app.name + "_" + k, d), set: (k, v) => save("app_" + app.name + "_" + k, v) },
    setTitle: t => { win.querySelector(".wt").textContent = t; },
    close: () => closeWin(win.id)
  };
}

async function load(app, body, win) {
  try {
    if (app.builtin) { body.innerHTML = ""; app.open(body, makeOS(app, win)); return; }
    const text = await fetch(app.url).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
    body.innerHTML = "";
    if (isNative(app)) {
      const mod = await import(URL.createObjectURL(new Blob([text], { type: "text/javascript" })));
      await mod.default.open(body, makeOS(app, win));
    } else {
      // classic hub apps: write the fetched HTML into an iframe (GitHub raw sends a sandbox CSP otherwise)
      const f = document.createElement("iframe");
      f.src = "about:blank";
      body.appendChild(f);
      const d = f.contentDocument; d.open(); d.write(text); d.close();
    }
  } catch (e) {
    console.error(e);
    body.innerHTML = `<div class="load err">Failed to load ${esc(app.name)}</div>`;
  }
}

// ===================== SYSTEM APPS =====================
const STORE = { builtin: 1, single: 1, name: "App Store", icon: "🛒", color: "violet", open(root) {
  root.innerHTML = `<div class="pad"><h2>App Store</h2><input id="q" placeholder="Search apps..." autocomplete="off"><div class="tabs"></div><div class="grid"></div></div>`;
  const tabsEl = root.querySelector(".tabs"), grid = root.querySelector(".grid"), q = root.querySelector("#q");
  let tab = "all";
  const draw = () => {
    tabsEl.innerHTML = [["all", "All"], ["apps", "Apps"], ["tools", "Tools"]].map(([k, l]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${l}</button>`).join("");
    const t = q.value.toLowerCase().trim();
    const list = catalog.filter(a => (tab === "all" || a.category === tab) && (!t || a.name.toLowerCase().includes(t)));
    grid.innerHTML = list.length ? "" : '<p style="color:var(--dim)">No apps found</p>';
    list.forEach(a => {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `<div>${glyph(a, 34)}${esc(a.name)}</div><p>${esc(a.desc || "")}</p><button class="${isInstalled(a) ? "on" : ""}">${isInstalled(a) ? "Installed ✓" : "Install"}</button>`;
      c.querySelector("button").onclick = () => { toggleInstall(a); draw(); };
      grid.appendChild(c);
    });
  };
  tabsEl.onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; draw(); } };
  q.oninput = draw;
  draw();
}};

const SETTINGS = { builtin: 1, single: 1, name: "Settings", icon: "⚙️", color: "cyan", open(root) {
  const s = getSettings();
  root.innerHTML = `<div class="pad"><h2>Settings</h2>
    <label>Site name<input type="text" id="s1" value="${esc(s.site)}" maxlength="40"></label>
    <label>Background<select id="s2"><option value="default">Default</option><option value="color">Solid color</option><option value="link">Image link</option></select></label>
    <label>Color<input type="color" id="s3" value="${s.bgColor}"></label>
    <label>Image link<input type="text" id="s4" value="${esc(s.bgLink)}" placeholder="https://..."></label></div>`;
  root.querySelector("#s2").value = s.bgMode;
  root.oninput = () => {
    save("settings", { site: root.querySelector("#s1").value.trim() || "VUS-OS", bgMode: root.querySelector("#s2").value, bgColor: root.querySelector("#s3").value, bgLink: root.querySelector("#s4").value.trim() });
    applyTheme();
  };
}};

const getSettings = () => Object.assign({ site: "VUS-OS", bgMode: "default", bgColor: "#0a0e1a", bgLink: "" }, LS("settings", {}));
function applyTheme() {
  const s = getSettings();
  document.title = s.site; $("#bootTitle").textContent = s.site;
  const d = $("#desktop").style;
  d.background = s.bgMode === "color" ? s.bgColor
    : s.bgMode === "link" && s.bgLink ? `url("${s.bgLink}") center/cover no-repeat, var(--bg)`
    : "radial-gradient(circle at 15% 15%,rgba(34,197,94,.10),transparent 45%),radial-gradient(circle at 85% 80%,rgba(16,185,129,.08),transparent 45%),var(--bg)";
}

// ===================== TASKBAR + START MENU =====================
[[STORE, "store"], [SETTINGS, "settings"]].forEach(([app, cls]) => {
  const t = document.createElement("div");
  t.className = "sys " + cls; t.title = app.name; t.textContent = app.icon;
  t.onclick = () => openApp(app);
  $("#sys").appendChild(t);
});

const start = $("#start");
$("#startBtn").onclick = e => { e.stopPropagation(); start.classList.toggle("open"); if (start.classList.contains("open")) { $("#startQ").value = ""; drawStart(); $("#startQ").focus(); } };
document.addEventListener("click", e => { if (!start.contains(e.target)) start.classList.remove("open"); });
$("#startQ").oninput = drawStart;
function drawStart() {
  const t = $("#startQ").value.toLowerCase().trim();
  const list = catalog.filter(a => !t || a.name.toLowerCase().includes(t));
  const box = $("#startList"); box.innerHTML = "";
  list.forEach(a => {
    const d = document.createElement("div");
    d.className = "item";
    d.innerHTML = glyph(a, 32) + `<div style="overflow:hidden"><b>${esc(a.name)}</b><small>${esc(a.desc || "")}</small></div>`;
    d.onclick = () => { openApp(a); start.classList.remove("open"); };
    box.appendChild(d);
  });
}

function tick() { $("#clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
setInterval(tick, 15000); tick();

// ===================== BOOT =====================
applyTheme();
requestAnimationFrame(() => requestAnimationFrame(() => { $("#fill").style.width = "100%"; }));
const minBoot = new Promise(r => setTimeout(r, 1800));
Promise.all([loadCatalog(), minBoot]).then(() => {
  if (!LS("seeded", false)) {
    save("installed", SEED.map(nm => catalog.find(a => a.name === nm)).filter(Boolean).map(key));
    save("seeded", true);
  }
  renderIcons();
  $("#boot").classList.add("hide");
  setTimeout(() => $("#boot").remove(), 550);
});
</script>
