<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VUS-OS</title>
<style>
:root{--bg:#000;--el:#202020;--card:#2b2b2b;--hover:#3a3a3a;--bd:#3d3d3d;--fg:#fff;--mute:#a6a6a6;--dim:#767676;--ac:#0078d7;--ac2:#4cc2ff;--danger:#e81123;--tb:40px;--font:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--mono:Consolas,'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;user-select:none}
input,select,button{font-family:var(--font)}
.gl{display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;border-radius:2px}
.win-logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:18px;height:18px}
.win-logo i{background:#fff}

#boot{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;transition:opacity .4s}
#boot.hide{opacity:0;pointer-events:none}
#boot .win-logo{width:72px;height:72px;gap:5px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #333;border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#bootTitle{font-size:15px;color:#bbb}

#desktop{position:fixed;inset:0 0 var(--tb) 0;overflow:hidden}
#icons{position:absolute;inset:0;touch-action:none}
#icons .icon{position:absolute;width:calc(var(--cw,80px) - 4px);touch-action:none}
.icon{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border:1px solid transparent;cursor:default;text-align:center}
.icon:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.15)}
.icon.sel{background:color-mix(in srgb,var(--ac) 40%,transparent);border-color:var(--ac)}
.lbl{font-size:12px;line-height:1.2;color:#fff;text-shadow:0 1px 2px #000,0 0 4px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

.win{position:absolute;min-width:300px;min-height:200px;background:var(--el);border:1px solid #3a3a3a;box-shadow:0 8px 28px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}
.win.focus{border-color:var(--ac);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.win.min{display:none}
.win.max{top:0!important;left:0!important;width:100%!important;height:100%!important;border:0}
.bar{height:32px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding-left:8px;background:#2b2b2b;touch-action:none}
.win.focus .bar{background:#1c1c1c}
.wt{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{width:46px;height:32px;border:0;background:transparent;color:#fff;font-size:12px;cursor:default}
.bar button:hover{background:rgba(255,255,255,.1)}
.bar button.x:hover{background:var(--danger)}
.body{flex:1;min-height:0;position:relative;background:#000;overflow:hidden}
.body iframe{width:100%;height:100%;border:0;display:block}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:13px var(--mono);color:var(--dim);background:var(--el)}
.load.err{color:#ff6b6b}
.win:not(.focus) .body:has(iframe)::after{content:"";position:absolute;inset:0;z-index:3}
.bar button svg{pointer-events:none}.bar .i2{display:none}.win.max .bar .i1{display:none}.win.max .bar .i2{display:inline}
.pbar{width:220px;height:6px;background:#444;margin:12px auto 0}.pbar i{display:block;height:100%;width:0;background:var(--ac)}
.lock{position:fixed;inset:0;z-index:990;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,20,20,.55);backdrop-filter:blur(8px);color:#fff}
.lock.full{background:rgba(10,10,10,.92);backdrop-filter:blur(40px)}
.lk-time{font-size:72px;font-weight:200}.lk-date{font-size:20px;margin-bottom:24px}.lk-t{font-size:16px}
.lk-dots{display:flex;gap:14px}.lk-dots i{width:14px;height:14px;border:2px solid #fff;border-radius:50%}.lk-dots i.on{background:#fff}
.lk-msg{height:18px;font-size:13px;color:#ff8a8a}
.lk-pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}.lk-pad button{height:52px;font-size:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:2px;cursor:pointer}.lk-pad button:hover{background:rgba(255,255,255,.22)}
.lk-foot{display:flex;gap:20px;font-size:13px;margin-top:6px}.lk-foot a{color:#fff;opacity:.8;text-decoration:underline;cursor:pointer}
.shake{animation:shk .3s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lk-in{width:240px;height:36px;padding:0 10px;font-size:15px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:2px;outline:0}
.lk-ok{height:32px;padding:0 24px;background:var(--ac);border:0;color:#fff;border-radius:2px;cursor:pointer}
.dlg .dlgb{padding:0;min-width:340px;max-width:440px}
.dlgt{padding:8px 12px;font-size:12px;opacity:.85}
.dlgm{padding:14px 18px 6px}.dlgm p{margin:0 0 10px;font-size:14px;line-height:1.5}
.dlg .dlgf{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;background:rgba(128,128,128,.14)}
.dlgf button{min-width:84px;padding:6px 14px;border:1px solid rgba(128,128,128,.6);background:rgba(128,128,128,.2);color:inherit;cursor:pointer}.dlgf button:hover{border-color:var(--ac)}.dlgf button:focus{outline:2px solid var(--ac);outline-offset:1px}.dlgf button.danger{background:#c42b1c;border-color:#c42b1c;color:#fff}
.rz{position:absolute;touch-action:none;z-index:6}
.rz.n{top:0;left:10px;right:10px;height:5px;cursor:ns-resize}.rz.s{bottom:0;left:10px;right:10px;height:5px;cursor:ns-resize}
.rz.e{right:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}.rz.w{left:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:12px;height:12px}
.rz.ne{top:0;right:0;cursor:nesw-resize}.rz.nw{top:0;left:0;cursor:nwse-resize}.rz.se{bottom:0;right:0;cursor:nwse-resize}.rz.sw{bottom:0;left:0;cursor:nesw-resize}
.win.max .rz{display:none}
@media (pointer:coarse){.rz.n,.rz.s{height:12px}.rz.e,.rz.w{width:12px}.rz.ne,.rz.nw,.rz.se,.rz.sw{width:22px;height:22px}}

#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);background:rgba(16,16,16,.93);backdrop-filter:blur(20px);display:flex;align-items:stretch;z-index:500}
#startBtn{width:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:default;flex-shrink:0}
#startBtn:hover,#startBtn.on{background:rgba(255,255,255,.14)}
#searchBtn{width:240px;margin:0 4px;padding:0 12px;display:flex;align-items:center;background:#2f2f2f;border:1px solid #454545;color:#bbb;font-size:13px;cursor:text;flex-shrink:0;align-self:center;height:32px;margin-top:0}
@media(max-width:760px){#searchBtn{display:none}}
#sys{display:flex;flex-shrink:0}
.sys{width:48px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:default}
.sys:hover{background:rgba(255,255,255,.14)}
#tasks{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;min-width:0}
.task{display:flex;align-items:center;gap:8px;min-width:48px;max-width:170px;padding:0 12px;font-size:12px;border-bottom:2px solid var(--ac2);background:rgba(255,255,255,.06);cursor:default;flex-shrink:0}
.task:hover{background:rgba(255,255,255,.14)}
.task.active{background:rgba(255,255,255,.2)}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{padding:0 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12px;line-height:1.3;flex-shrink:0}
#tray{display:flex;align-items:stretch;flex-shrink:0}
#tray .tr,#bell{min-width:34px;padding:0 4px;display:flex;align-items:center;justify-content:center;cursor:default;position:relative;flex-shrink:0;font-size:11px}
#tray .tr:hover,#bell:hover,#clock:hover{background:rgba(255,255,255,.1)}
[data-theme=light] #tray .tr:hover,[data-theme=light] #bell:hover,[data-theme=light] #clock:hover{background:rgba(0,0,0,.08)}
#bell .bdg{position:absolute;top:5px;right:3px;min-width:14px;height:14px;border-radius:7px;background:var(--ac);color:#fff;font-size:10px;line-height:14px;text-align:center}
#flyout{position:fixed;right:0;bottom:var(--tb);width:360px;max-width:100%;max-height:calc(100% - var(--tb));overflow:auto;background:rgba(31,31,31,.97);backdrop-filter:blur(30px);border:1px solid #3a3a3a;border-bottom:0;display:none;z-index:650;padding:14px;color:#fff}
[data-theme=light] #flyout{background:rgba(246,246,246,.98);border-color:#c8c8c8;color:#111}
.cal-h{font-size:34px;font-weight:300}.cal-d{font-size:14px;opacity:.8;margin:2px 0 10px}
.cal-n{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.cal-n button{background:none;border:0;color:inherit;font-size:13px;width:32px;height:28px;cursor:pointer}.cal-n button:hover{background:rgba(128,128,128,.25)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}.cal-g span{padding:8px 0;font-size:13px}.cal-g .w{opacity:.6;font-size:11px}.cal-g .o{opacity:.4}.cal-g .t{background:var(--ac);color:#fff;opacity:1}
#flyout a{cursor:pointer;text-decoration:underline;font-size:13px;opacity:.85}
.ac-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ac-n{padding:10px;margin-bottom:6px;background:rgba(128,128,128,.18);font-size:13px}.ac-n small{display:block;opacity:.6;margin-top:4px}.ac-l p{opacity:.6;padding:16px 0;text-align:center}
.ac-q{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.ac-q button{padding:12px 4px;font-size:12px;border:0;background:rgba(128,128,128,.25);color:inherit;cursor:pointer}.ac-q button:hover{background:var(--ac);color:#fff}
#toasts{position:fixed;right:12px;bottom:calc(var(--tb) + 12px);z-index:700;display:flex;flex-direction:column;gap:8px}
.toast{width:320px;max-width:calc(100vw - 24px);padding:12px 14px;background:#2b2b2b;color:#fff;border-left:3px solid var(--ac);box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13px}.toast div{opacity:.8;margin-top:3px}
[data-theme=light] .toast{background:#fff;color:#111}
#showdesk{width:6px;border-left:1px solid #555;flex-shrink:0}
#showdesk:hover{background:rgba(255,255,255,.2)}

#start{position:fixed;left:0;bottom:var(--tb);width:690px;max-width:100%;height:min(600px,calc(100% - var(--tb)));background:rgba(31,31,31,.97);backdrop-filter:blur(30px);border:1px solid #3a3a3a;border-bottom:0;display:none;z-index:600}
#start.open{display:flex}
.st-l{width:290px;display:flex;flex-direction:column;border-right:1px solid #2e2e2e;min-width:0}
.st-l input{margin:10px;padding:9px 10px;background:#2b2b2b;border:1px solid #444;color:#fff;font-size:13px;outline:none;user-select:text}
.st-l input:focus{border-color:var(--ac)}
#startList{flex:1;overflow-y:auto;padding:0 4px 8px}
.st-h{font-size:12px;font-weight:600;color:var(--ac2);padding:8px 10px 2px}
.st-r{flex:1;padding:14px 12px;overflow-y:auto}
.st-r h3{font-size:14px;font-weight:600;margin-bottom:10px;color:#ddd}
#tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;padding:8px;border:2px solid transparent;cursor:default}
.tile:hover{border-color:rgba(255,255,255,.5)}
.tile .ti{font-size:28px;align-self:center;margin-top:10px}
.tile .tn{font-size:12px;line-height:1.2}
@media(max-width:560px){.st-r{display:none}.st-l{width:100%}}
.item{display:flex;align-items:center;gap:12px;padding:6px 10px;cursor:default}
.item:hover{background:rgba(255,255,255,.1)}
.item b{display:block;font-size:13px;font-weight:400}
.item small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.row:hover{background:none}

.pad{height:100%;overflow-y:auto;padding:20px 24px;background:var(--el);display:flex;flex-direction:column;gap:12px}
.pad h2{font-size:20px;font-weight:600}
.pad label{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--bd)}
.pad input,.pad select{background:#333;border:1px solid #666;padding:6px 10px;color:#fff;font-size:13px;outline:none;border-radius:0;user-select:text}
.pad input:focus,.pad select:focus{border-color:var(--ac)}
.pad label input[type=text]{width:200px}
.pad input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);padding:0}
.tabs{display:flex;gap:6px}
.tabs button,.card button,.item button{padding:6px 14px;border:1px solid #666;background:#333;color:#fff;font-size:12px;cursor:default;border-radius:0}
.tabs button:hover,.card button:hover,.item button:hover{background:#444}
.tabs button.on,.card button.on,.item button.on{background:var(--ac);border-color:var(--ac)}
.item button{margin-left:auto;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;align-content:start}
.card{background:var(--card);border:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:10px}
.card div{display:flex;align-items:center;gap:10px;font-size:14px}
.card p{font-size:12px;color:var(--mute);line-height:1.4}
.card button{align-self:flex-start}
.st{display:flex;height:100%;background:var(--el)}
.stn{width:170px;flex-shrink:0;border-right:1px solid var(--bd);padding:8px 0;overflow-y:auto}
.stn div{padding:10px 14px;cursor:default;font-size:13px;border-left:3px solid transparent}
.stn div:hover{background:rgba(255,255,255,.08)}.stn div.on{border-left-color:var(--ac);background:rgba(255,255,255,.06)}
.stc{flex:1;min-width:0;overflow-y:auto;padding:20px 26px;display:flex;flex-direction:column;gap:10px}
.stc h2{font-size:22px;font-weight:600}.stc h3{font-size:14px;font-weight:600;margin-top:14px}
.stc label{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0;font-size:13px;border-bottom:1px solid var(--bd)}
.stc input,.stc select{background:#333;border:1px solid #666;padding:6px 10px;color:#fff;font-size:13px;outline:none;border-radius:0;user-select:text}
.stc input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}.stc input[type=color]{padding:0;width:44px;height:28px}
.stc button{padding:6px 14px;border:1px solid #666;background:#333;color:#fff;font-size:12px;cursor:default;align-self:flex-start}
.stc button:hover{background:#444}.stc p{font-size:12px;color:var(--mute)}
.sth{display:flex;flex-wrap:wrap;gap:10px}
.stt{display:flex;flex-direction:column;gap:6px;width:150px;height:96px;padding:12px;background:var(--card);border:1px solid transparent;cursor:default;font-size:13px}
.stt:hover{border-color:var(--ac)}.stt span{font-size:26px}
.sbar{height:10px;background:#444}.sbar i{display:block;height:100%;background:var(--ac)}
.sws{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sw{width:28px;height:28px;border:2px solid transparent;cursor:default}.sw.on{border-color:#fff}
.fxw{height:100%;display:flex;flex-direction:column;background:var(--el)}
.fxt{padding:6px;background:#2b2b2b;align-items:center}.fxp{font-size:12px;color:var(--mute);margin-left:8px}
.fx{flex:1;overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,var(--cw,80px));grid-auto-rows:var(--rh,92px);gap:2px;align-content:start;position:relative}
.fx{position:relative}
.marq{position:absolute;border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 30%,transparent);pointer-events:none;z-index:5}
.icon.dragging{pointer-events:none;opacity:.65;z-index:5}
.icon.cut{opacity:.5}
.rn{width:100%;font:inherit;font-size:12px;background:#fff;color:#000;border:1px solid var(--ac);padding:1px 2px;text-align:center;outline:none;user-select:text}
.fxb{flex:1;display:flex;min-height:0}
.fxs{width:150px;flex-shrink:0;border-right:1px solid var(--bd);padding:6px 0}
.fxs div{display:flex;gap:8px;align-items:center;padding:8px 14px;font-size:13px;cursor:default;border-left:3px solid transparent}
.fxs div:hover{background:rgba(255,255,255,.08)}.fxs div.on{background:rgba(255,255,255,.1);border-left-color:var(--ac)}
.fxs b{margin-left:auto;font-weight:400;font-size:11px;color:var(--mute)}
.fxe{grid-column:1/-1;color:var(--dim);font-size:13px;padding:20px}
.fxa{margin-left:auto;display:flex;gap:6px}
#pins{display:flex;flex-shrink:0}
.pin{width:48px;display:flex;align-items:center;justify-content:center;cursor:default;border-bottom:2px solid transparent;flex-shrink:0}
.pin:hover{background:rgba(255,255,255,.14)}.pin.run{border-bottom-color:var(--ac2)}.pin.active{background:rgba(255,255,255,.2)}
.dt{padding:18px 22px;overflow:auto;height:100%;background:var(--el)}
.dt h2{display:flex;gap:12px;align-items:center;font-size:16px;font-weight:600;margin-bottom:14px;word-break:break-all}
.dt table{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;color:var(--mute);font-weight:400;padding:6px 12px 6px 0;width:130px;vertical-align:top}
.dt td{padding:6px 0;word-break:break-all;user-select:text}.dt tr+tr>*{border-top:1px solid var(--bd)}.dt p{font-size:12px;color:var(--mute);margin-top:10px}
.fx.list{display:block;padding:0}
.fxh,.icon.row{display:grid;grid-template-columns:28px minmax(120px,1fr) 150px 180px 80px;gap:10px;align-items:center;padding:0 12px}
.fxh{height:28px;font-size:11px;color:var(--mute);border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--el);z-index:2}
.icon.row{height:30px;text-align:left}
.icon.row .lbl{display:block;text-align:left;text-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.icon.row span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-rail{width:48px;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.3);flex-shrink:0}
.st-rail div{height:48px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:default}
.st-rail div:hover{background:rgba(255,255,255,.14)}
#snap{position:absolute;display:none;pointer-events:none;z-index:2147483000;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5)}
.dlg{position:fixed;inset:0;z-index:995;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:12px}
.dlgb{background:#2b2b2b;border:1px solid var(--ac);max-width:440px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.6)}

.dlgf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlgf button{padding:7px 14px;border:1px solid #666;background:#3a3a3a;color:#fff;font-size:12px;cursor:default}
.dlgf button:hover{background:#4a4a4a}.dlgf button.danger{background:#a4262c;border-color:#a4262c}
.vw{height:100%;display:flex;flex-direction:column;background:#111}
.vt{padding:6px;background:#2b2b2b}
.vb{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
.vc{display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;padding:20px;text-align:center}

#ctx{position:fixed;z-index:900;min-width:200px;background:#2b2b2b;border:1px solid #454545;padding:2px 0;display:none;box-shadow:0 8px 20px rgba(0,0,0,.5)}
#ctx div{padding:7px 28px 7px 14px;font-size:12.5px;cursor:default}
#ctx div:hover{background:rgba(255,255,255,.1)}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:#555}::-webkit-scrollbar-track{background:#2b2b2b}

<body>
<div id="boot"><div class="win-logo"><i></i><i></i><i></i><i></i></div><div class="spin"></div><div id="bootTitle">VUS-OS</div></div>
<div id="desktop"><div id="icons"></div><div id="snap"></div></div>
<div id="start"><div class="st-rail"></div><div class="st-l"><input id="startQ" placeholder="Type here to search" autocomplete="off"><div id="startList"></div></div><div class="st-r"><h3>Apps</h3><div id="tiles"></div></div></div>
<div id="ctx"></div>
<input type="file" id="up" multiple hidden>
<input type="file" id="upd" webkitdirectory multiple hidden>
<input type="file" id="upz" accept=".zip,application/zip" hidden>
<div id="taskbar">
  <button id="startBtn" title="Start"><span class="win-logo"><i></i><i></i><i></i><i></i></span></button>
  <div id="searchBtn"><svg viewBox="0 0 24 24" width="16" height="16" style="margin-right:10px;vertical-align:-3px"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2"/></svg>Type here to search</div>
  <div id="sys"></div>
  <div id="pins"></div><div id="tasks"></div>
  <div id="tray"></div>
  <div id="clock"><div id="ck1"></div><div id="ck2"></div></div>
  <div id="bell" title="Notifications"></div>
  <div id="showdesk" title="Show desktop"></div>
</div>
<div id="flyout"></div><div id="toasts"></div>

<script>
// ===================== CONFIG =====================
const APPS_JSON = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS/refs/heads/main/apps.json";
const OS_REPO   = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS-OS/refs/heads/main/";
// One small file with a number per app, e.g. {"MZK PLAYA": 2}. Bump a number to update just that app.
const VERSIONS_URL = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS-OS/refs/heads/main/versions.json";

// Native apps: a .js file that does `export default { open(root, os) {...} }`.
// Point "url" at any raw link; update the link here when you edit an app.
const NATIVE = [
  { name: "Notes", url: OS_REPO + "apps/notes.js", desc: "Text files and code editor", icon: "svg:notes", color: "amber", category: "tools", type: "native" }
];
const SEED = ["Notes", "VUS Launcher"]; // installed on first run

// ===================== HELPERS =====================
const $ = s => document.querySelector(s);
const GUEST = sessionStorage.getItem("vos_guest") === "1", NS = GUEST ? "vosg" : "vos2"; // Guest = separate storage, your real data is never loaded
const LS = (k, d) => { try { const v = JSON.parse(localStorage.getItem(NS + "_" + k)); return v ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(NS + "_" + k, JSON.stringify(v));
const esc = s => (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const key = a => a.name + "|" + a.url;
const isNative = a => a.type === "native" || /\.js(\?|$)/.test(a.url || "");
const COLORS = { green:["34,197,94","#4ade80"], blue:["59,130,246","#60a5fa"], amber:["245,158,11","#fbbf24"], rose:["244,63,94","#fb7185"], violet:["139,92,246","#a78bfa"], cyan:["6,182,212","#22d3ee"], lime:["132,204,22","#a3e635"], orange:["249,115,22","#fb923c"], red:["239,68,68","#f87171"], purple:["168,85,247","#c084fc"], black:["148,163,184","#cbd5e1"], white:["255,255,255","#f1f5f9"] };
const solid = a => { const c = (COLORS[a.color] || COLORS.green)[0]; return c === "255,255,255" ? ["#e6e6e6", "#000"] : [`rgb(${c})`, "#fff"]; };
const ln = d => `<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
const PG = x => `<path d="M5 2h9l5 5v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" fill="#fff" stroke="#bdbdbd"/><path d="M14 2l5 5h-4a1 1 0 0 1-1-1z" fill="#d0d0d0"/>${x}`;
const SVG = {
  folder: '<path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v1H2z" fill="#e0a800"/><path d="M2 9h20v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#ffd34e"/>',
  text: PG('<path d="M7 12h10M7 15h10M7 18h6" stroke="#6b8cc9" stroke-width="1.4"/>'),
  html: PG('<path d="M9.5 11.5L6.5 15l3 3.5M14.5 11.5l3 3.5-3 3.5" fill="none" stroke="#e8710a" stroke-width="1.6"/>'),
  image: PG('<rect x="6" y="11" width="12" height="8" fill="#4cc2ff"/><path d="M6 19l4-5 3 3 2-2 3 4z" fill="#107c10"/><circle cx="15" cy="13.5" r="1.2" fill="#fff"/>'),
  audio: PG('<path d="M10 17v-8l7-1.5v8" fill="none" stroke="#e3008c" stroke-width="1.6"/><circle cx="8.5" cy="17" r="1.8" fill="#e3008c"/><circle cx="15.5" cy="15.5" r="1.8" fill="#e3008c"/>'),
  video: PG('<rect x="6" y="11" width="12" height="8" rx="1" fill="#8764b8"/><path d="M11 13v4l4-2z" fill="#fff"/>'),
  pdf: PG('<rect x="5.5" y="11" width="13" height="7" fill="#e81123"/><text x="12" y="16.5" font-size="5" font-weight="700" text-anchor="middle" fill="#fff" font-family="Arial">PDF</text>'),
  binary: PG('<rect x="5.5" y="11" width="13" height="8" fill="#0078d7"/><rect x="5.5" y="11" width="13" height="2" fill="#4cc2ff"/>'),
  notes: '<rect x="5" y="3" width="14" height="18" rx="1" fill="#4cc2ff"/><path d="M8 3v18" stroke="#0078d7"/><path d="M10.5 8h6M10.5 11h6M10.5 14h4" stroke="#fff" stroke-width="1.4"/>',
  info: '<circle cx="12" cy="12" r="9" fill="#0078d7"/><path d="M12 11v6M12 7.5v.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>',
  settings: ln('M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1'),
  store: ln('M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2'),
  update: ln('M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5'),
  taskmgr: ln('M3 20h18M6 17v-5M11 17V6M16 17v-8'),
  power: ln('M12 3v8M7 6.5a8 8 0 1 0 10 0'),
  desktop: ln('M4 5h16v11H4zM8 20h8M12 16v4'),
  temp: ln('M12 5a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 9v4l3 2'),
  saved: ln('M4 4h13l3 3v13H4zM8 4v5h7V4M8 20v-6h8v6'),
  bin: ln('M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13'),
  binfull: ln('M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6')
};
const svgI = (n, s) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}">${SVG[n] || ""}</svg>`;
const glyph = (a, s = ICON_PX[getSettings().iconSize] || 42) => { if (String(a.icon || "").startsWith("svg:")) return `<div class="gl" style="width:${s}px;height:${s}px">${svgI(a.icon.slice(4), s)}</div>`; const [bg, fg] = solid(a); return `<div class="gl" style="width:${s}px;height:${s}px;font-size:${Math.round(s * .42)}px;background:${bg};color:${fg}">${esc(a.icon || a.name.slice(0, 2).toUpperCase())}</div>`; };

// ===================== CATALOG (apps + tools only) =====================
let catalog = [...NATIVE];

function loadCatalog() { // 5s timeout; falls back to the last catalog that loaded
  const add = d => ["apps", "tools"].forEach(cat => (d[cat] || []).forEach(a => { if (!a.name || !a.url || catalog.some(c => c.name === a.name)) return; catalog.push({ ...a, category: cat }); }));
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 5000);
  return fetch(APPS_JSON, { signal: ctl.signal }).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => { save("catalog", d); add(d); return true; })
    .catch(() => { const d = LS("catalog", null); if (d) add(d); return false; }).finally(() => clearTimeout(t));
}

// ===================== INSTALLED =====================
const installed = () => LS("installed", []);
const isInstalled = a => installed().includes(key(a));
function toggleInstall(a) {
  let list = installed();
  list = list.includes(key(a)) ? list.filter(k => k !== key(a)) : [...list, key(a)];
  save("installed", list);
  renderIcons();
}
const refreshers = new Set(); // open File Explorer windows redraw through this
function renderIcons() {
  const keep = new Set(selIcons().map(i => i.dataset.key)), box = $("#icons"); box.innerHTML = "";
  purgeBin(); const nb = getBin();
  box.appendChild(iconEl({ name: "Recycle Bin", icon: nb.files.length + nb.folders.length ? "svg:binfull" : "svg:bin", color: "blue" }, "Recycle Bin", () => openApp(BIN), [["Open", () => openApp(BIN)], ["Empty Recycle Bin", emptyBin]], { kind: "app", id: "__bin" }));
  installed().map(k => catalog.find(a => key(a) === k)).filter(Boolean).forEach(a => box.appendChild(iconEl(a, a.name, () => openApp(a),
    [...appMenu(a), ["Remove from desktop", () => toggleInstall(a)]], { kind: "app", id: key(a), del: () => toggleInstall(a) })));
  fillDir(box, null, id => openApp(folderApp(id)));
  layoutDesktop([...box.children]);
  refreshers.forEach(fn => fn());
  document.querySelectorAll(".icon").forEach(i => { if (keep.has(i.dataset.key)) i.classList.add("sel"); }); markCut(); // selection survives a redraw
}

// ===================== CONTEXT MENU =====================
function ctx(e, items) {
  const m = $("#ctx");
  m.innerHTML = "";
  items.forEach(([label, fn]) => { const d = document.createElement("div"); d.textContent = label; d.onclick = ev => { ev.stopPropagation(); m.style.display = "none"; fn(e); }; m.appendChild(d); });
  m.style.display = "block"; // measure first so the menu always stays fully on screen
  m.style.left = Math.max(4, Math.min(e.clientX, innerWidth - m.offsetWidth - 4)) + "px";
  m.style.top = Math.max(4, Math.min(e.clientY, innerHeight - m.offsetHeight - 4)) + "px";
}
document.addEventListener("click", () => $("#ctx").style.display = "none");
$("#desktop").addEventListener("click", e => { if (marqMoved) { marqMoved = false; return; } if (!e.target.closest(".icon,.win")) clearSel(); }); // clicks inside windows keep the selection
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable) return;
  const sel = selIcons(), mod = e.ctrlKey || e.metaKey, k = (e.key || "").toLowerCase(), fw = document.querySelector(".win.focus"), fx = fw ? fw.querySelector(".fx") : null;
  if (mod && k === "c" && sel.length) { e.preventDefault(); clipSet("copy", sel); }
  else if (mod && k === "x" && sel.length) { e.preventDefault(); clipSet("cut", sel); }
  else if (mod && k === "v" && clip && (fx ? fx._dir !== undefined : !fw)) { e.preventDefault(); pasteTo(fx ? fx._dir : null); }
  else if (mod && k === "a" && (fx || !fw)) { e.preventDefault(); clearSel(); (fx || $("#icons")).querySelectorAll(".icon").forEach(i => i.classList.add("sel")); }
  else if (e.key === "Delete" && sel.length) deleteSel(sel);
  else if (e.key === "F2" && sel.length === 1 && sel[0].dataset.kind !== "app") inlineRename(sel[0], sel[0].dataset.kind, sel[0].dataset.id);
});
let clip = null; // { mode: "copy" | "cut", items: [{ kind, id }] }
const newMenu = (dir, box) => [...(clip ? [["Paste", () => pasteTo(dir)]] : []), ["New folder", () => newFolder(dir, box)], ["New text document", () => newFile("txt", dir, box)], ["Upload files...", () => pickUpload(dir, false)], ["Refresh", renderIcons]];
let upDir = null;
const pickUpload = (dir, mode) => { upDir = dir; $(mode === "zip" ? "#upz" : mode ? "#upd" : "#up").click(); };
$("#desktop").addEventListener("contextmenu", e => { if (e.target.closest(".icon,.win")) return; e.preventDefault(); ctx(e, newMenu(null, $("#icons"))); });
$("#up").onchange = e => { addFiles(e.target.files, upDir); e.target.value = ""; };
$("#upd").onchange = e => { addFiles(e.target.files, upDir, true); e.target.value = ""; };
$("#upz").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (f) await importZip(f, upDir); };
$("#desktop").addEventListener("dragover", e => e.preventDefault());
$("#desktop").addEventListener("drop", e => { e.preventDefault(); addFiles(e.dataTransfer.files, null); });
$("#showdesk").onclick = () => { wins.forEach(w => { w.el.classList.add("min"); w.task.classList.remove("active"); }); renderPins(); };

// ===================== WINDOWS =====================
let z = 10, n = 0;
const wins = new Map();

function openApp(app) {
  const ex = app.single && [...wins.values()].find(w => w.app === app);
  if (ex) return toggle(ex.id);
  if (!app.builtin && !isNative(app) && !/raw\.githubusercontent\.com/.test(app.url)) {
    window.open(app.url, "_blank", "noopener"); return; // external sites open in a new tab
  }
  const id = "w" + (++n), el = document.createElement("div");
  const o = (n % 8) * 26;
  el.className = "win"; el.id = id;
  Object.assign(el.style, { width: Math.min(app.w || 760, innerWidth - 40) + "px", height: Math.min(app.h || 520, innerHeight - 120) + "px", left: 20 + o + "px", top: 20 + o + "px" });
  el.innerHTML = `<div class="bar">${glyph(app, 16)}<div class="wt">${esc(app.name)}</div><button data-a="min"><svg width="10" height="10"><path d="M0 5.5h10" stroke="currentColor"/></svg></button><button data-a="max"><svg class="i1" width="10" height="10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg><svg class="i2" width="10" height="10"><path d="M2.5 2.5v-2h7v7h-2M.5 2.5h7v7h-7z" fill="none" stroke="currentColor"/></svg></button><button data-a="x" class="x"><svg width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button></div><div class="body"><div class="load">Loading ${esc(app.name)}...</div></div>${["n", "s", "e", "w", "ne", "nw", "se", "sw"].map(d => `<div class="rz ${d}" data-d="${d}"></div>`).join("")}`;
  $("#desktop").appendChild(el);

  const task = document.createElement("div");
  task.className = "task";
  task.innerHTML = glyph(app, 20) + `<span>${esc(app.name)}</span>`;
  task.onclick = () => toggle(id);
  task.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); ctx(e, [...(catalog.includes(app) ? [[pinnedKeys().includes(key(app)) ? "Unpin from taskbar" : "Pin to taskbar", () => togglePin(app)]] : []), ["Close window", () => closeWin(id)]]); };
  $("#tasks").appendChild(task);
  wins.set(id, { id, app, el, task });

  const bar = el.querySelector(".bar");
  bar.onclick = e => {
    const a = e.target.dataset.a;
    if (a === "min") { el.classList.add("min"); task.classList.remove("active"); renderPins(); }
    if (a === "max") el.classList.toggle("max");
    if (a === "x") closeWin(id);
  };
  bar.ondblclick = e => { if (!e.target.closest("button")) el.classList.toggle("max"); };
  bar.onpointerdown = e => {
    if (e.target.closest("button") || el.classList.contains("max")) return;
    let sx = e.clientX, sy = e.clientY, l = el.offsetLeft, t = el.offsetTop, moved = false, zone = null;
    bar.setPointerCapture(e.pointerId);
    bar.onpointermove = ev => {
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 4) return;
      if (!moved) {
        moved = true;
        if (el.dataset.restore) { // dragging a snapped window pulls it back to its old size
          const r = JSON.parse(el.dataset.restore); delete el.dataset.restore;
          el.style.width = r.w + "px"; el.style.height = r.h + "px";
          l = Math.min(Math.max(0, ev.clientX - r.w / 2), innerWidth - r.w); t = el.offsetTop; sx = ev.clientX; sy = ev.clientY;
        }
      }
      el.style.left = Math.min(Math.max(l + ev.clientX - sx, 80 - el.offsetWidth), innerWidth - 80) + "px"; el.style.top = Math.min(Math.max(0, t + ev.clientY - sy), $("#desktop").clientHeight - 32) + "px";
      zone = getSettings().snap ? (ev.clientX <= 6 ? "l" : ev.clientX >= innerWidth - 6 ? "r" : ev.clientY <= 6 ? "t" : null) : null;
      showSnap(zone);
    };
    bar.onpointerup = () => { bar.onpointermove = bar.onpointerup = null; showSnap(null); if (zone) snapWin(el, zone); };
  };
  el.querySelectorAll(".rz").forEach(h => h.onpointerdown = e => { // drag any edge or corner
    if (el.classList.contains("max")) return;
    e.preventDefault(); h.setPointerCapture(e.pointerId);
    const d = h.dataset.d, sx = e.clientX, sy = e.clientY, w = el.offsetWidth, ht = el.offsetHeight, l = el.offsetLeft, t = el.offsetTop;
    h.onpointermove = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy; let nw = w, nh = ht, nl = l, nt = t;
      if (d.includes("e")) nw = Math.max(300, w + dx);
      if (d.includes("s")) nh = Math.max(200, ht + dy);
      if (d.includes("w")) { nw = Math.max(300, w - dx); nl = l + w - nw; }
      if (d.includes("n")) { nh = Math.max(200, ht - dy); nt = Math.max(0, t + ht - nh); nh = t + ht - nt; }
      el.style.width = nw + "px"; el.style.height = nh + "px"; el.style.left = nl + "px"; el.style.top = nt + "px";
    };
    h.onpointerup = () => { h.onpointermove = h.onpointerup = null; };
  });
  el.addEventListener("pointerdown", () => focus(id), true);
  focus(id);
  load(app, el.querySelector(".body"), el);
}

// ===================== START PINS + TASKBAR PINS =====================
const startKeys = () => { let l = LS("startPins", null); if (!l) { l = installed(); save("startPins", l); } return l; };

async function readZip(file) { // -> [{name, dir, data()}]
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);

async function exportZip(icons) { // icons: the selected (or all shown) explorer icons
  const items = icons.filter(i => i.dataset.kind !== "app");
  if (!items.length) return winAlert("Nothing to export here.");
  const entries = [];
  const addFolder = (fid, prefix) => {
    entries.push({ name: prefix });
    fmeta().filter(f => f.parent === fid).forEach(f => entries.push({ file: f, name: prefix + f.name }));
    folders().filter(f => f.parent === fid).forEach(f => addFolder(f.id, prefix + f.name + "/"));
  };
  items.forEach(i => { if (i.dataset.kind === "folder") addFolder(i.dataset.id, folders().find(f => f.id === i.dataset.id).name + "/"); else { const f = fmeta().find(x => x.id === i.dataset.id); entries.push({ file: f, name: f.name }); } });
  for (const e of entries) if (e.file) { const b = await dbGet(e.file.id, "files"); e.data = new Uint8Array(b ? await b.arrayBuffer() : 0); e.date = e.file.mod; }

}
async function importZip(file, parent = null) {
  try {
    for (const e of await readZip(file)) {
      const parts = e.name.split("/").filter(Boolean);
      if (!parts.length || parts[0] === "__MACOSX" || parts[parts.length - 1] === ".DS_Store") continue;
      if (e.dir) { ensureFolders(parent, parts); continue; }
      const fname = parts.pop(), p = ensureFolders(parent, parts);
      await putFile(newId(), uniqueName(fname, null, p), new File([await e.data()], fname, { type: mimeOf(fname) }), p);
    }
    renderIcons();
  } catch (err) { winAlert("Couldn't read that zip file: " + err.message); }
}

const KIND_NAME = { text: "Text document", html: "HTML document", image: "Image", audio: "Audio", video: "Video", pdf: "PDF document", binary: "Application" };

const gcd = (a, b) => b ? gcd(b, a % b) : a;

}
const dur = t => { t = Math.round(t); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), p = n => String(n).padStart(2, "0"); return (h ? h + ":" + p(m) : m) + ":" + p(t % 60); };
const when = t => t ? new Date(t).toLocaleString() : "Unknown";

async function mediaInfo(f, k, blob) { // extra rows that depend on what's inside the file
  if (!blob) return [["Contents", "File data not found"]];
  if (k === "binary") return [["Contents", "Program file (can't be opened here)"]];
  const url = URL.createObjectURL(new Blob([blob], { type: mimeOf(f.name) })), done = r => { URL.revokeObjectURL(url); return r; };
  if (k === "image") return new Promise(res => { const i = new Image(); i.onload = () => res(done([["Dimensions", `${i.naturalWidth} × ${i.naturalHeight} px`], ["Aspect ratio", ratio(i.naturalWidth, i.naturalHeight)], ["Megapixels", (i.naturalWidth * i.naturalHeight / 1e6).toFixed(2) + " MP"]])); i.onerror = () => res(done([["Image", "Couldn't read this image"]])); i.src = url; });
  if (k === "audio" || k === "video") return new Promise(res => {
    const m = document.createElement(k), bad = () => { clearTimeout(t); res(done([["Media", "Couldn't read this file (unsupported format?)"]])); }, t = setTimeout(bad, 5000);
    m.preload = "metadata";
    m.onloadedmetadata = () => {
      clearTimeout(t); const ok = isFinite(m.duration), r = [["Length", ok ? dur(m.duration) : "Unknown"]];
      if (k === "video" && m.videoWidth) r.push(["Frame size", `${m.videoWidth} × ${m.videoHeight} px`], ["Aspect ratio", ratio(m.videoWidth, m.videoHeight)]);
      if (ok && m.duration > 0) r.push(["Average bitrate", Math.round((f.size || 0) * 8 / m.duration / 1000) + " kbps"]);
      res(done(r));
    };
    m.onerror = bad; m.src = url;

  if ((f.size || 0) > 20e6) return done([]);
  const t = await blob.text();
  if (k === "pdf") { const n = (t.match(/\/Type\s*\/Page[^s]/g) || []).length; return done(n ? [["Pages (approx.)", n]] : []); }
  const rows = [["Lines", (t ? t.split(/\r\n|\r|\n/).length : 0).toLocaleString()], ["Words", (t.trim() ? t.trim().split(/\s+/).length : 0).toLocaleString()], ["Characters", t.length.toLocaleString()]];
  if (k === "html") { const m = t.match(/<title[^>]*>([\s\S]*?)<\/title>/i); if (m) rows.unshift(["Page title", esc(m[1].trim())]); }
  if (extOf(f.name) === "json") { try { const j = JSON.parse(t); rows.unshift(["JSON", Array.isArray(j) ? `Valid, array of ${j.length}` : j && typeof j === "object" ? `Valid, object with ${Object.keys(j).length} keys` : "Valid"]); } catch { rows.unshift(["JSON", "Not valid JSON"]); } }
  return done(rows);
}
async function details(root, kind, id, a) {

  if (kind === "app") {
    const m = metaAll()[a.name], head = `<h2>${glyph(a, 36)}${esc(a.name)}</h2>`, yn = v => v ? "Yes" : "No";
    return show(head + kv([["Name", esc(a.name)], ["Type", isNative(a) ? "Native app (.js)" : "App"], ["Category", esc(a.category || "—")], ["Description", esc(a.desc || "—")], ["Source", esc(a.url)],
      ["Saved copy", m ? `v${m.version} · ${fmt(m.size || 0)}` : "Not saved yet (it downloads the first time you open it)"], ["Latest version known", "v" + remoteVer(a.name)],
      ["On the desktop", yn(isInstalled(a))], ["In Start", yn(startKeys().includes(key(a)))], ["Pinned to taskbar", yn(pinnedKeys().includes(key(a)))]]));

    const ids = [id, ...descendants(id)], files = fmeta().filter(x => ids.includes(x.parent)), head = `<h2>${glyph({ name: f.name, icon: "svg:folder", color: "amber" }, 36)}${esc(f.name)}</h2>`;
    return show(head + kv([["Name", esc(f.name)], ["Type", "Folder"], ["Location", esc(pathOf(f.parent || null))], ["Contains", `${files.length} file${files.length === 1 ? "" : "s"}, ${ids.length - 1} folder${ids.length === 2 ? "" : "s"}`], ["Total size", sizeStr(files.reduce((n, x) => n + (x.size || 0), 0))], ["Status", f.saved === false ? "Temporary (not saved yet)" : "Saved"]]));

  const base = [["Name", esc(f.name)], ["Type", KIND_NAME[k] + (ext ? ` (.${esc(ext)})` : "")], ["MIME type", esc(mimeOf(f.name))], ["Size", sizeStr(f.size)], ["Location", esc(pathOf(f.parent || null))], ["Status", f.saved === false ? "Temporary (not saved yet)" : "Saved"], ["Modified", when(f.mod)]];

      if (fl.some(x => x.id === f.id || (x.name === f.name && (x.parent || null) === par && x.size === f.size))) continue;
      const e = ents.find(z => z.name === "files/" + f.id); if (!e) continue;
      await idbPut(db, f.id, new Blob([await e.data()])); fl.push({ ...f, parent: par });
    }
    save("files", fl);
  }
  if (m.apps) save("installed", isRep ? m.apps : [...new Set([...installed(), ...m.apps])]);
  if (m.pos) save("pos", isRep ? m.pos : { ...m.pos, ...LS("pos", {}) });
  if (m.settings) save("settings", isRep ? m.settings : { ...LS("settings", {}), ...m.settings });
  renderIcons(); applyTheme(); tick();
  notify("Import finished", parts.join(", "));
}

// ===================== RECYCLE BIN =====================
function purgeBin(all = false) { // removes items older than the "delete after" setting (0 = never)
  const days = getSettings().binDays; if (!all && !days) return;
  const b = getBin(), old = x => all || x.del < Date.now() - days * 864e5, dead = b.files.filter(old);
  if (!dead.length && !b.folders.some(old)) return;
  dead.forEach(f => dbDel(f.id, "files"));
  putBin({ files: b.files.filter(f => !old(f)), folders: b.folders.filter(f => !old(f)) });
}
const binKids = (b, id) => { const ids = [id]; for (let i = 0; i < ids.length; i++) b.folders.forEach(x => { if (x.parent === ids[i] && !ids.includes(x.id)) ids.push(x.id); }); return ids; };
function binRestore(kind, id) { // goes back where it was, or to the desktop if that folder is gone; renames if the name is taken
  const b = getBin(), live = folders(), strip = ({ del, top, ...r }) => r;
  if (kind === "file") {
    const f = b.files.find(x => x.id === id); if (!f) return;
    const par = f.parent && live.some(x => x.id === f.parent) ? f.parent : null;
    save("files", [...fmeta(), { ...strip(f), parent: par, name: uniqueName(f.name, null, par) }]);
    putBin({ files: b.files.filter(x => x.id !== id), folders: b.folders });
  } else {
    const top = b.folders.find(x => x.id === id); if (!top) return;
    const ids = binKids(b, id), par = top.parent && live.some(x => x.id === top.parent) ? top.parent : null;
    save("folders", [...live, ...b.folders.filter(x => ids.includes(x.id)).map(x => x.id === id ? { ...strip(x), parent: par, name: uniqueName(x.name, null, par, live) } : strip(x))]);
    save("files", [...fmeta(), ...b.files.filter(f => ids.includes(f.parent)).map(strip)]);
    putBin({ files: b.files.filter(f => !ids.includes(f.parent)), folders: b.folders.filter(x => !ids.includes(x.id)) });
  }
}
function binDelete(kind, id) {
  const b = getBin(), ids = kind === "folder" ? binKids(b, id) : [id];
  const files = kind === "file" ? b.files.filter(f => f.id === id) : b.files.filter(f => ids.includes(f.parent));
  files.forEach(f => dbDel(f.id, "files"));
  putBin({ files: b.files.filter(f => !files.includes(f)), folders: kind === "folder" ? b.folders.filter(x => !ids.includes(x.id)) : b.folders });
}
async function emptyBin() {
  const b = getBin(); if (!b.files.length && !b.folders.length) return;
  if (await winDialog("Permanently delete everything in the Recycle Bin? This can't be undone.", [["Empty", "y", "danger"], ["Cancel", false]]) === "y") { purgeBin(true); renderIcons(); }
}
const BIN = { builtin: 1, single: 1, name: "Recycle Bin", icon: "svg:bin", color: "blue", w: 640, h: 420, open(root, os) {
  const sel = new Set(); let rows = [];
  const draw = () => {
    if (!root.isConnected) return refreshers.delete(draw);
    purgeBin(); const b = getBin(), d = getSettings().binDays;
    rows = [...b.folders.filter(f => f.top).map(f => ({ k: "folder:" + f.id, kind: "folder", id: f.id, name: f.name, t: f.del, ic: "svg:folder", size: "" })),
      ...b.files.filter(f => !b.folders.some(x => x.id === f.parent)).map(f => ({ k: "file:" + f.id, kind: "file", id: f.id, name: f.name, t: f.del, ic: KIND_ICON[kindOf(f.name)][0], size: fmt(f.size || 0) }))].sort((x, y) => y.t - x.t);
    [...sel].forEach(k => { if (!rows.some(r => r.k === k)) sel.delete(k); });
    root.innerHTML = `<div style="display:flex;flex-direction:column;height:100%"><div style="padding:8px;display:flex;gap:8px"><button data-a="restore">Restore</button><button data-a="del">Delete permanently</button><button data-a="empty">Empty Recycle Bin</button></div><div style="flex:1;overflow:auto">${rows.length ? rows.map(r => `<div data-k="${esc(r.k)}" style="display:flex;align-items:center;gap:10px;padding:6px 10px;cursor:default;${sel.has(r.k) ? "background:var(--ac);color:#fff" : ""}">${glyph({ icon: r.ic }, 20)}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span><span style="width:100px">${new Date(r.t).toLocaleDateString()}</span><span style="width:70px">${r.size}</span></div>`).join("") : '<p style="padding:24px;text-align:center;opacity:.7">The Recycle Bin is empty.</p>'}</div><div style="padding:8px;font-size:12px;opacity:.7">${d ? `Items are deleted for good after ${d === 1 ? "1 day" : d + " days"}.` : "Items stay here until you delete them."} Change this in Settings > System.</div></div>`;
  };
  root.onclick = async e => {
    const a = e.target.closest("[data-a]")?.dataset.a, row = e.target.closest("[data-k]")?.dataset.k;
    if (row) { sel.has(row) ? sel.delete(row) : sel.add(row); return draw(); }
    const picked = rows.filter(r => sel.has(r.k));
    if (a === "empty") await emptyBin();
    else if (a === "restore" && picked.length) { picked.forEach(r => binRestore(r.kind, r.id)); renderIcons(); }
    else if (a === "del" && picked.length && await winDialog(`Permanently delete ${picked.length} item${picked.length > 1 ? "s" : ""}? This can't be undone.`, [["Delete", "y", "danger"], ["Cancel", false]]) === "y") { picked.forEach(r => binDelete(r.kind, r.id)); renderIcons(); }
    sel.clear(); draw();
  };
  refreshers.add(draw); draw();
} };

// ===================== COPY / CUT / PASTE =====================
function markCut() { document.querySelectorAll(".icon").forEach(i => i.classList.toggle("cut", !!clip && clip.mode === "cut" && clip.items.some(x => x.kind + ":" + x.id === i.dataset.key))); }
function clipSet(mode, sel) { // apps can't be copied, only files and folders
  const items = sel.filter(i => i.dataset.kind !== "app").map(i => ({ kind: i.dataset.kind, id: i.dataset.id }));
  if (!items.length) return;
  clip = { mode, items }; markCut();
}
async function copyFile(id, dir) {
  const f = fmeta().find(x => x.id === id), b = f && await dbGet(id, "files"); if (!b) return false;
  return putFile(newId(), uniqueName(f.name, null, dir), b, dir, f.saved);
}
async function copyFolder(id, dir) {
  const fo = folders().find(x => x.id === id); if (!fo) return;
  if (dir === id || descendants(id).includes(dir)) return winAlert("Can't copy a folder into itself.");
  const files = fmeta().filter(x => x.parent === id), subs = folders().filter(x => x.parent === id), nid = newId(), list = folders(); // lists taken first so the new copy is never copied into itself
  save("folders", [...list, { ...fo, id: nid, parent: dir, name: uniqueName(fo.name, null, dir, list) }]);
  for (const f of files) await copyFile(f.id, nid);
  for (const sf of subs) await copyFolder(sf.id, nid);
}
async function pasteTo(dir) {
  if (!clip) return;
  const { mode, items } = clip;
  for (const it of items) {
    if (mode === "cut") moveTo(it.kind, it.id, dir);
    else if (it.kind === "file") await copyFile(it.id, dir);
    else await copyFolder(it.id, dir);
  }
  if (mode === "cut") clip = null;
  renderIcons();
}

// ===================== TRAY, CALENDAR, NOTIFICATIONS =====================
Object.assign(SVG, {
  wifi: ln('M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0') + '<circle cx="12" cy="19.5" r="1.3" fill="currentColor"/>',
  nowifi: ln('M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M3 3l18 18'),
  battery: ln('M3 8h15v8H3zM21 11v2'),
  bell: ln('M6 17v-6a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4')
});
const notes = []; // notifications from this session
let flyMode = null, cal = null, batt = null;
function notify(title, body = "") { // small toast + a line in the notification panel (apps can call os.notify)
  notes.unshift({ title, body, time: Date.now() }); renderBell();
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<b>${esc(title)}</b>${body ? `<div>${esc(body)}</div>` : ""}`;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), 5000);
  if (flyMode === "ac") drawFly();
}
function renderBell() { $("#bell").innerHTML = svgI("bell", 18) + (notes.length ? `<span class="bdg">${notes.length}</span>` : ""); }
function renderTray() {
  const on = navigator.onLine, pc = batt ? Math.round(batt.level * 100) : 0;
  $("#tray").innerHTML = `<div class="tr" data-f="net" title="${on ? "Connected" : "No internet"}">${svgI(on ? "wifi" : "nowifi", 18)}</div>${batt ? `<div class="tr" data-f="bat" title="Battery ${pc}%">${svgI("battery", 18)}<span style="margin-left:3px">${pc}%</span></div>` : ""}`;
}
const calTime = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit", hour12: !getSettings().hour24 });
function drawFly() {
  const f = $("#flyout"), now = new Date();
  if (flyMode === "cal") {
    cal = cal || { y: now.getFullYear(), m: now.getMonth() };
    const first = new Date(cal.y, cal.m, 1), cells = [];
    for (let i = 0; i < 42; i++) { const d = new Date(cal.y, cal.m, 1 - first.getDay() + i); cells.push(`<span class="${d.getMonth() !== cal.m ? "o" : ""} ${d.toDateString() === now.toDateString() ? "t" : ""}">${d.getDate()}</span>`); }
    f.innerHTML = `<div class="cal-h">${calTime()}</div><div class="cal-d">${now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</div><div class="cal-n"><b>${first.toLocaleDateString([], { month: "long", year: "numeric" })}</b><span><button data-c="-1">▲</button><button data-c="1">▼</button></span></div><div class="cal-g">${["S", "M", "T", "W", "T", "F", "S"].map(x => `<span class="w">${x}</span>`).join("")}${cells.join("")}</div><div style="margin-top:10px"><a data-c="today">Go to today</a></div>`;
  } else if (flyMode === "ac") {
    f.innerHTML = `<div class="ac-h"><b>Notifications</b><a data-a="clear">Clear all</a></div><div class="ac-l">${notes.length ? notes.map(n => `<div class="ac-n"><b>${esc(n.title)}</b>${n.body ? `<div>${esc(n.body)}</div>` : ""}<small>${new Date(n.time).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</small></div>`).join("") : "<p>No new notifications</p>"}</div><div class="ac-q"><button data-a="theme">${getSettings().theme === "dark" ? "Light mode" : "Dark mode"}</button>${hasPw() && !GUEST ? '<button data-a="lock">Lock</button>' : ""}<button data-a="settings">All settings</button></div>`;
  } else if (flyMode === "net") {
    const c = navigator.connection;
    f.innerHTML = `<b>${navigator.onLine ? "Connected" : "No internet"}</b><p style="margin-top:6px;opacity:.8;font-size:13px">${navigator.onLine ? "VUS-OS can reach the internet." + (c && c.effectiveType ? `<br>Connection: ${c.effectiveType}${c.downlink ? `, about ${c.downlink} Mbps` : ""}` : "") : "Apps you already opened still work offline."}</p>`;
  } else if (flyMode === "bat" && batt) {
    f.innerHTML = `<b>Battery ${Math.round(batt.level * 100)}%</b><p style="margin-top:6px;opacity:.8;font-size:13px">${batt.charging ? "Charging" : "On battery"}</p>`;
  }
}
function hideFly() { flyMode = null; $("#flyout").style.display = "none"; }
function toggleFly(mode) {
  if (flyMode === mode) return hideFly();
  flyMode = mode; cal = null; drawFly(); $("#flyout").style.display = "block"; toggleStart(false);
}
$("#clock").onclick = () => toggleFly("cal");
$("#bell").onclick = () => toggleFly("ac");
$("#tray").onclick = e => { const t = e.target.closest("[data-f]"); if (t) toggleFly(t.dataset.f); };
$("#flyout").onclick = e => {
  const c = e.target.closest("[data-c]")?.dataset.c, a = e.target.closest("[data-a]")?.dataset.a;
  if (c) { if (c === "today") cal = null; else { const d = new Date(cal.y, cal.m + +c, 1); cal = { y: d.getFullYear(), m: d.getMonth() }; } drawFly(); }
  else if (a === "clear") { notes.length = 0; renderBell(); drawFly(); }
  else if (a === "theme") { save("settings", { ...getSettings(), theme: getSettings().theme === "dark" ? "light" : "dark" }); applyTheme(); drawFly(); }
  else if (a === "lock") { hideFly(); lockNow(); }
  else if (a === "settings") { hideFly(); openApp(SETTINGS); }
};
document.addEventListener("click", e => { if (flyMode && !e.target.closest("#flyout,#tray,#clock,#bell")) hideFly(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && flyMode) hideFly(); });
setInterval(() => { if (flyMode === "cal") { const h = $(".cal-h"); if (h) h.textContent = calTime(); } }, 1000);
addEventListener("online", renderTray); addEventListener("offline", renderTray);
navigator.getBattery?.().then(b => { batt = b; ["levelchange", "chargingchange"].forEach(ev => b.addEventListener(ev, renderTray)); renderTray(); });
renderTray(); renderBell();

// ===================== BOOT =====================
applyTheme();
marquee($("#icons"));
const minBoot = new Promise(r => setTimeout(r, 1800));
Promise.all([loadCatalog(), minBoot]).then(([ok]) => {
  if (ok && !LS("seeded", false)) {
    save("installed", SEED.map(nm => catalog.find(a => a.name === nm)).filter(Boolean).map(key));
    save("seeded", true);
  }
  renderIcons(); renderPins();
  autoUpdate(); // background; skipped when auto update is off
  if (sessionStorage.getItem("vos_ok")) sessionStorage.removeItem("vos_ok"); else lockNow();
  $("#boot").classList.add("hide");
  setTimeout(() => $("#boot").remove(), 550);
});
</script>
