<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VUS-OS</title>
<style>
:root{--bg:#000;--el:#202020;--card:#2b2b2b;--hover:#3a3a3a;--bd:#3d3d3d;--fg:#fff;--mute:#a6a6a6;--dim:#767676;--ac:#0078d7;--ac2:#4cc2ff;--danger:#e81123;--tb:40px;--font:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--mono:Consolas,'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;user-select:none}
input,select,button{font-family:var(--font)}
.gl{display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;border-radius:2px}
.win-logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:18px;height:18px}
.win-logo i{background:#fff}

#boot{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;transition:opacity .4s}
#boot.hide{opacity:0;pointer-events:none}
#boot .win-logo{width:72px;height:72px;gap:5px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #333;border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#bootTitle{font-size:15px;color:#bbb}

#desktop{position:fixed;inset:0 0 var(--tb) 0;overflow:hidden}
#icons{position:absolute;inset:0;padding:8px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);grid-auto-columns:80px;gap:2px;align-content:start;justify-content:start}
.icon{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border:1px solid transparent;cursor:default;text-align:center}
.icon:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.15)}
.icon.sel{background:rgba(0,120,215,.35);border-color:rgba(0,120,215,.8)}
.lbl{font-size:12px;line-height:1.2;color:#fff;text-shadow:0 1px 2px #000,0 0 4px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

.win{position:absolute;min-width:300px;min-height:200px;background:var(--el);border:1px solid #3a3a3a;box-shadow:0 8px 28px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}
.win.focus{border-color:var(--ac);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.win.min{display:none}
.win.max{top:0!important;left:0!important;width:100%!important;height:100%!important;border:0}
.bar{height:32px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding-left:8px;background:#2b2b2b;touch-action:none}
.win.focus .bar{background:#1c1c1c}
.wt{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{width:46px;height:32px;border:0;background:transparent;color:#fff;font-size:12px;cursor:default}
.bar button:hover{background:rgba(255,255,255,.1)}
.bar button.x:hover{background:var(--danger)}
.body{flex:1;min-height:0;position:relative;background:#000;overflow:hidden}
.body iframe{width:100%;height:100%;border:0;display:block}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:13px var(--mono);color:var(--dim);background:var(--el)}
.load.err{color:#ff6b6b}
.rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none}

#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);background:rgba(16,16,16,.93);backdrop-filter:blur(20px);display:flex;align-items:stretch;z-index:500}
#startBtn{width:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:default;flex-shrink:0}
#startBtn:hover,#startBtn.on{background:rgba(255,255,255,.14)}
#searchBtn{width:240px;margin:0 4px;padding:0 12px;display:flex;align-items:center;background:#2f2f2f;border:1px solid #454545;color:#bbb;font-size:13px;cursor:text;flex-shrink:0;align-self:center;height:32px;margin-top:0}
@media(max-width:760px){#searchBtn{display:none}}
#sys{display:flex;flex-shrink:0}
.sys{width:48px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:default}
.sys:hover{background:rgba(255,255,255,.14)}
#tasks{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;min-width:0}
.task{display:flex;align-items:center;gap:8px;min-width:48px;max-width:170px;padding:0 12px;font-size:12px;border-bottom:2px solid var(--ac2);background:rgba(255,255,255,.06);cursor:default;flex-shrink:0}
.task:hover{background:rgba(255,255,255,.14)}
.task.active{background:rgba(255,255,255,.2)}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{padding:0 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12px;line-height:1.3;flex-shrink:0}
#showdesk{width:6px;border-left:1px solid #555;flex-shrink:0}
#showdesk:hover{background:rgba(255,255,255,.2)}

#start{position:fixed;left:0;bottom:var(--tb);width:640px;max-width:100%;height:min(600px,calc(100% - var(--tb)));background:rgba(31,31,31,.97);backdrop-filter:blur(30px);border:1px solid #3a3a3a;border-bottom:0;display:none;z-index:600}
#start.open{display:flex}
.st-l{width:290px;display:flex;flex-direction:column;border-right:1px solid #2e2e2e;min-width:0}
.st-l input{margin:10px;padding:9px 10px;background:#2b2b2b;border:1px solid #444;color:#fff;font-size:13px;outline:none;user-select:text}
.st-l input:focus{border-color:var(--ac)}
#startList{flex:1;overflow-y:auto;padding:0 4px 8px}
.st-h{font-size:12px;font-weight:600;color:var(--ac2);padding:8px 10px 2px}
.st-r{flex:1;padding:14px 12px;overflow-y:auto}
.st-r h3{font-size:14px;font-weight:600;margin-bottom:10px;color:#ddd}
#tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;padding:8px;border:2px solid transparent;cursor:default}
.tile:hover{border-color:rgba(255,255,255,.5)}
.tile .ti{font-size:28px;align-self:center;margin-top:10px}
.tile .tn{font-size:12px;line-height:1.2}
@media(max-width:560px){.st-r{display:none}.st-l{width:100%}}
.item{display:flex;align-items:center;gap:12px;padding:6px 10px;cursor:default}
.item:hover{background:rgba(255,255,255,.1)}
.item b{display:block;font-size:13px;font-weight:400}
.item small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.row:hover{background:none}

.pad{height:100%;overflow-y:auto;padding:20px 24px;background:var(--el);display:flex;flex-direction:column;gap:12px}
.pad h2{font-size:20px;font-weight:600}
.pad label{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--bd)}
.pad input,.pad select{background:#333;border:1px solid #666;padding:6px 10px;color:#fff;font-size:13px;outline:none;border-radius:0;user-select:text}
.pad input:focus,.pad select:focus{border-color:var(--ac)}
.pad label input[type=text]{width:200px}
.pad input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);padding:0}
.tabs{display:flex;gap:6px}
.tabs button,.card button,.item button{padding:6px 14px;border:1px solid #666;background:#333;color:#fff;font-size:12px;cursor:default;border-radius:0}
.tabs button:hover,.card button:hover,.item button:hover{background:#444}
.tabs button.on,.card button.on,.item button.on{background:var(--ac);border-color:var(--ac)}
.item button{margin-left:auto;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;align-content:start}
.card{background:var(--card);border:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:10px}
.card div{display:flex;align-items:center;gap:10px;font-size:14px}
.card p{font-size:12px;color:var(--mute);line-height:1.4}
.card button{align-self:flex-start}

#ctx{position:fixed;z-index:900;min-width:200px;background:#2b2b2b;border:1px solid #454545;padding:2px 0;display:none;box-shadow:0 8px 20px rgba(0,0,0,.5)}
#ctx div{padding:7px 28px 7px 14px;font-size:12.5px;cursor:default}
#ctx div:hover{background:rgba(255,255,255,.1)}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:#555}::-webkit-scrollbar-track{background:#2b2b2b}
</style>
</head>
<body>
<div id="boot"><div class="win-logo"><i></i><i></i><i></i><i></i></div><div class="spin"></div><div id="bootTitle">VUS-OS</div></div>
<div id="desktop"><div id="icons"></div></div>
<div id="start"><div class="st-l"><input id="startQ" placeholder="Type here to search" autocomplete="off"><div id="startList"></div></div><div class="st-r"><h3>Apps</h3><div id="tiles"></div></div></div>
<div id="ctx"></div>
<div id="taskbar">
  <button id="startBtn" title="Start"><span class="win-logo"><i></i><i></i><i></i><i></i></span></button>
  <div id="searchBtn">🔍&nbsp; Type here to search</div>
  <div id="sys"></div>
  <div id="tasks"></div>
  <div id="clock"><div id="ck1"></div><div id="ck2"></div></div>
  <div id="showdesk" title="Show desktop"></div>
</div>

<script>
// ===================== CONFIG =====================
const APPS_JSON = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS/refs/heads/main/apps.json";
const OS_REPO   = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS-OS/refs/heads/main/";
// One small file with a number per app, e.g. {"MZK PLAYA": 2}. Bump a number to update just that app.
const VERSIONS_URL = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS-OS/refs/heads/main/versions.json";

// Native apps: a .js file that does `export default { open(root, os) {...} }`.
// Point "url" at any raw link; update the link here when you edit an app.
const NATIVE = [
  { name: "Notes", url: OS_REPO + "apps/notes.js", desc: "Text files and code editor", icon: "📝", color: "amber", category: "tools", type: "native" }
];
const SEED = ["Notes", "VUS Launcher"]; // installed on first run

// ===================== HELPERS =====================
const $ = s => document.querySelector(s);
const LS = (k, d) => { try { const v = JSON.parse(localStorage.getItem("vos2_" + k)); return v ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem("vos2_" + k, JSON.stringify(v));
const esc = s => (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const key = a => a.name + "|" + a.url;
const isNative = a => a.type === "native" || /\.js(\?|$)/.test(a.url || "");
const COLORS = { green:["34,197,94","#4ade80"], blue:["59,130,246","#60a5fa"], amber:["245,158,11","#fbbf24"], rose:["244,63,94","#fb7185"], violet:["139,92,246","#a78bfa"], cyan:["6,182,212","#22d3ee"], lime:["132,204,22","#a3e635"], orange:["249,115,22","#fb923c"], red:["239,68,68","#f87171"], purple:["168,85,247","#c084fc"], black:["148,163,184","#cbd5e1"], white:["255,255,255","#f1f5f9"] };
const solid = a => { const c = (COLORS[a.color] || COLORS.green)[0]; return c === "255,255,255" ? ["#e6e6e6", "#000"] : [`rgb(${c})`, "#fff"]; };
const glyph = (a, s = 42) => { const [bg, fg] = solid(a); return `<div class="gl" style="width:${s}px;height:${s}px;font-size:${Math.round(s * .42)}px;background:${bg};color:${fg}">${esc(a.icon || a.name.slice(0, 2).toUpperCase())}</div>`; };

// ===================== CATALOG (apps + tools only) =====================
let catalog = [...NATIVE];

function loadCatalog() {
  return fetch(APPS_JSON).then(r => r.json()).then(d => {
    ["apps", "tools"].forEach(cat => (d[cat] || []).forEach(a => {
      if (!a.name || !a.url || catalog.some(c => c.name === a.name)) return; // native versions win by name
      catalog.push({ ...a, category: cat });
    }));
  }).catch(e => console.error("apps.json failed", e));
}

// ===================== INSTALLED =====================
const installed = () => LS("installed", []);
const isInstalled = a => installed().includes(key(a));
function toggleInstall(a) {
  let list = installed();
  list = list.includes(key(a)) ? list.filter(k => k !== key(a)) : [...list, key(a)];
  save("installed", list);
  renderIcons();
}
function renderIcons() {
  const box = $("#icons"); box.innerHTML = "";
  installed().map(k => catalog.find(a => key(a) === k)).filter(Boolean).forEach(a => {
    const el = document.createElement("div");
    el.className = "icon";
    el.innerHTML = glyph(a) + `<div class="lbl">${esc(a.name)}</div>`;
    // Windows-style: click selects, double-click opens (a single tap opens on touch screens)
    el.onclick = e => {
      document.querySelectorAll(".icon.sel").forEach(i => i.classList.remove("sel"));
      el.classList.add("sel");
      if (e.detail >= 2 || matchMedia("(pointer:coarse)").matches) openApp(a);
    };
    el.oncontextmenu = e => { e.preventDefault(); ctx(e, [["Open", () => openApp(a)], ["Remove from desktop", () => toggleInstall(a)]]); };
    box.appendChild(el);
  });
}

// ===================== CONTEXT MENU =====================
function ctx(e, items) {
  const m = $("#ctx");
  m.innerHTML = "";
  items.forEach(([label, fn]) => { const d = document.createElement("div"); d.textContent = label; d.onclick = () => { fn(); m.style.display = "none"; }; m.appendChild(d); });
  m.style.left = Math.min(e.clientX, innerWidth - 200) + "px";
  m.style.top = Math.min(e.clientY, innerHeight - 80) + "px";
  m.style.display = "block";
}
document.addEventListener("click", () => $("#ctx").style.display = "none");
$("#desktop").addEventListener("click", e => { if (!e.target.closest(".icon")) document.querySelectorAll(".icon.sel").forEach(i => i.classList.remove("sel")); });
$("#showdesk").onclick = () => wins.forEach(w => { w.el.classList.add("min"); w.task.classList.remove("active"); });

// ===================== WINDOWS =====================
let z = 10, n = 0;
const wins = new Map();

function openApp(app) {
  const ex = app.single && [...wins.values()].find(w => w.app === app);
  if (ex) return toggle(ex.id);
  if (!app.builtin && !isNative(app) && !/raw\.githubusercontent\.com/.test(app.url)) {
    window.open(app.url, "_blank", "noopener"); return; // external sites open in a new tab
  }
  const id = "w" + (++n), el = document.createElement("div");
  const o = (n % 8) * 26;
  el.className = "win"; el.id = id;
  Object.assign(el.style, { width: Math.min(760, innerWidth - 40) + "px", height: Math.min(520, innerHeight - 120) + "px", left: 20 + o + "px", top: 20 + o + "px" });
  el.innerHTML = `<div class="bar">${glyph(app, 16)}<div class="wt">${esc(app.name)}</div><button data-a="min">—</button><button data-a="max">☐</button><button data-a="x" class="x">✕</button></div><div class="body"><div class="load">Loading ${esc(app.name)}...</div></div><div class="rs"></div>`;
  $("#desktop").appendChild(el);

  const task = document.createElement("div");
  task.className = "task";
  task.innerHTML = glyph(app, 20) + `<span>${esc(app.name)}</span>`;
  task.onclick = () => toggle(id);
  $("#tasks").appendChild(task);
  wins.set(id, { id, app, el, task });

  const bar = el.querySelector(".bar");
  bar.onclick = e => {
    const a = e.target.dataset.a;
    if (a === "min") { el.classList.add("min"); task.classList.remove("active"); }
    if (a === "max") el.classList.toggle("max");
    if (a === "x") closeWin(id);
  };
  bar.ondblclick = e => { if (!e.target.closest("button")) el.classList.toggle("max"); };
  bar.onpointerdown = e => {
    if (e.target.closest("button") || el.classList.contains("max")) return;
    const sx = e.clientX, sy = e.clientY, l = el.offsetLeft, t = el.offsetTop;
    bar.setPointerCapture(e.pointerId);
    bar.onpointermove = ev => { el.style.left = l + ev.clientX - sx + "px"; el.style.top = Math.max(0, t + ev.clientY - sy) + "px"; };
    bar.onpointerup = () => { bar.onpointermove = bar.onpointerup = null; };
  };
  const rs = el.querySelector(".rs");
  rs.onpointerdown = e => {
    const sx = e.clientX, sy = e.clientY, w = el.offsetWidth, h = el.offsetHeight;
    rs.setPointerCapture(e.pointerId);
    rs.onpointermove = ev => { el.style.width = Math.max(300, w + ev.clientX - sx) + "px"; el.style.height = Math.max(200, h + ev.clientY - sy) + "px"; };
    rs.onpointerup = () => { rs.onpointermove = rs.onpointerup = null; };
  };
  el.addEventListener("pointerdown", () => focus(id), true);
  focus(id);
  load(app, el.querySelector(".body"), el);
}

function focus(id) {
  wins.forEach(w => { w.el.classList.toggle("focus", w.id === id); w.task.classList.toggle("active", w.id === id); });
  wins.get(id).el.style.zIndex = ++z;
}
function toggle(id) {
  const w = wins.get(id);
  if (w.el.classList.contains("min")) { w.el.classList.remove("min"); focus(id); }
  else if (+w.el.style.zIndex === z) { w.el.classList.add("min"); w.task.classList.remove("active"); }
  else focus(id);
}
function closeWin(id) {
  const w = wins.get(id); if (!w) return;
  w.el.remove(); w.task.remove(); wins.delete(id);
}

// What a native app receives as its second argument.
function makeOS(app, win) {
  return {
    storage: { get: (k, d) => LS("app_" + app.name + "_" + k, d), set: (k, v) => save("app_" + app.name + "_" + k, v) },
    setTitle: t => { win.querySelector(".wt").textContent = t; },
    close: () => closeWin(win.id)
  };
}

// ===================== CODE CACHE + UPDATES =====================
// Code is saved in IndexedDB the first time an app opens. After that it opens from the saved copy.
// Small metadata {name: {url, version}} lives in localStorage.
const idb = new Promise((res, rej) => { const r = indexedDB.open("vos2", 1); r.onupgradeneeded = () => r.result.createObjectStore("code"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbGet = async k => { try { const d = await idb; return await new Promise(res => { const q = d.transaction("code").objectStore("code").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch { return undefined; } };
const dbSet = async (k, v) => { try { const d = await idb; return await new Promise(res => { const t = d.transaction("code", "readwrite"); t.objectStore("code").put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); }); } catch { return false; } };

let remote = null; // last versions.json we managed to fetch
async function getVersions(force) {
  if (remote && !force) return remote;
  try { const r = await fetch(VERSIONS_URL + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw 0; remote = await r.json(); return remote; }
  catch { return null; }
}
const remoteVer = name => (remote && remote[name]) || 1;
const metaAll = () => LS("meta", {});
async function fetchCode(app) {
  const r = await fetch(app.url + (app.url.includes("?") ? "&" : "?") + "v=" + remoteVer(app.name)); // ?v= dodges stale CDN copies
  if (!r.ok) throw new Error(r.status);
  return r.text();
}
async function saveCode(app, text) {
  if (!(await dbSet(app.name, text))) return;
  const m = metaAll(); m[app.name] = { url: app.url, version: remoteVer(app.name) }; save("meta", m);
}
async function getCode(app) {
  const m = metaAll()[app.name];
  if (m && m.url === app.url) { const c = await dbGet(app.name); if (c) return c; }
  await getVersions();
  const text = await fetchCode(app);
  await saveCode(app, text);
  return text;
}
async function updateApp(app) { // on any failure the old saved copy stays
  try { await saveCode(app, await fetchCode(app)); return true; } catch { return false; }
}
const cachedApps = () => Object.entries(metaAll()).map(([name, m]) => ({ app: catalog.find(a => a.name === name && a.url === m.url), m })).filter(x => x.app);
const outdated = () => cachedApps().filter(x => remoteVer(x.app.name) > x.m.version);
async function autoUpdate() {
  if (!getSettings().autoUpdate || !(await getVersions(true))) return;
  for (const x of outdated()) await updateApp(x.app);
}

async function load(app, body, win) {
  try {
    if (app.builtin) { body.innerHTML = ""; app.open(body, makeOS(app, win)); return; }
    const text = await getCode(app);
    body.innerHTML = "";
    if (isNative(app)) {
      const mod = await import(URL.createObjectURL(new Blob([text], { type: "text/javascript" })));
      await mod.default.open(body, makeOS(app, win));
    } else {
      // classic hub apps: write the fetched HTML into an iframe (GitHub raw sends a sandbox CSP otherwise)
      const f = document.createElement("iframe");
      f.src = "about:blank";
      body.appendChild(f);
      const d = f.contentDocument; d.open(); d.write(text); d.close();
    }
  } catch (e) {
    console.error(e);
    body.innerHTML = `<div class="load err">Failed to load ${esc(app.name)}</div>`;
  }
}

// ===================== SYSTEM APPS =====================
const STORE = { builtin: 1, single: 1, name: "App Store", icon: "🛒", color: "violet", open(root) {
  root.innerHTML = `<div class="pad"><h2>App Store</h2><input id="q" placeholder="Search apps..." autocomplete="off"><div class="tabs"></div><div class="grid"></div></div>`;
  const tabsEl = root.querySelector(".tabs"), grid = root.querySelector(".grid"), q = root.querySelector("#q");
  let tab = "all";
  const draw = () => {
    tabsEl.innerHTML = [["all", "All"], ["apps", "Apps"], ["tools", "Tools"]].map(([k, l]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${l}</button>`).join("");
    const t = q.value.toLowerCase().trim();
    const list = catalog.filter(a => (tab === "all" || a.category === tab) && (!t || a.name.toLowerCase().includes(t)));
    grid.innerHTML = list.length ? "" : '<p style="color:var(--dim)">No apps found</p>';
    list.forEach(a => {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `<div>${glyph(a, 34)}${esc(a.name)}</div><p>${esc(a.desc || "")}</p><button class="${isInstalled(a) ? "on" : ""}">${isInstalled(a) ? "Installed ✓" : "Install"}</button>`;
      c.querySelector("button").onclick = () => { toggleInstall(a); draw(); };
      grid.appendChild(c);
    });
  };
  tabsEl.onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; draw(); } };
  q.oninput = draw;
  draw();
}};

const SETTINGS = { builtin: 1, single: 1, name: "Settings", icon: "⚙️", color: "cyan", open(root) {
  const s = getSettings();
  root.innerHTML = `<div class="pad"><h2>Settings</h2>
    <label>Site name<input type="text" id="s1" value="${esc(s.site)}" maxlength="40"></label>
    <label>Background<select id="s2"><option value="default">Default</option><option value="color">Solid color</option><option value="link">Image link</option></select></label>
    <label>Color<input type="color" id="s3" value="${s.bgColor}"></label>
    <label>Image link<input type="text" id="s4" value="${esc(s.bgLink)}" placeholder="https://..."></label>
    <label>Auto update apps<input type="checkbox" id="s5" ${s.autoUpdate ? "checked" : ""}></label></div>`;
  root.querySelector("#s2").value = s.bgMode;
  root.oninput = e => {
    save("settings", { site: root.querySelector("#s1").value.trim() || "VUS-OS", bgMode: root.querySelector("#s2").value, bgColor: root.querySelector("#s3").value, bgLink: root.querySelector("#s4").value.trim(), autoUpdate: root.querySelector("#s5").checked });
    applyTheme();
    if (e.target.id === "s5" && e.target.checked) autoUpdate();
  };
}};

const UPDATES = { builtin: 1, single: 1, name: "Updates", icon: "🔄", color: "lime", open(root) {
  root.innerHTML = `<div class="pad"><h2>Updates</h2><div class="tabs"><button id="chk">Check now</button><button id="all">Update all</button></div><p id="st" style="font-size:12px;color:var(--mute)"></p><div id="rows"></div></div>`;
  const rows = root.querySelector("#rows"), st = root.querySelector("#st");
  const draw = () => {
    const list = cachedApps();
    rows.innerHTML = list.length ? "" : '<p style="color:var(--dim);font-size:13px">Apps show up here after you open them once.</p>';
    list.forEach(({ app, m }) => {
      const rv = remoteVer(app.name), old = rv > m.version;
      const d = document.createElement("div");
      d.className = "item row";
      d.innerHTML = glyph(app, 32) + `<div style="overflow:hidden"><b>${esc(app.name)}</b><small>${old ? `v${m.version} → v${rv}` : `v${m.version} · up to date`}</small></div>` + (old ? "<button>Update</button>" : "");
      if (old) d.querySelector("button").onclick = async e => { e.target.textContent = "Updating..."; await updateApp(app); draw(); };
      rows.appendChild(d);
    });
  };
  const check = async () => {
    st.textContent = "Checking...";
    const v = await getVersions(true);
    st.textContent = v ? "Auto update is " + (getSettings().autoUpdate ? "on" : "off") : "Couldn't reach the update file. Using saved versions.";
    draw();
  };
  root.querySelector("#chk").onclick = check;
  root.querySelector("#all").onclick = async e => { e.target.textContent = "Updating..."; for (const x of outdated()) await updateApp(x.app); e.target.textContent = "Update all"; draw(); };
  check();
}};

const getSettings = () => Object.assign({ site: "VUS-OS", bgMode: "default", bgColor: "#0a0e1a", bgLink: "", autoUpdate: true }, LS("settings", {}));
function applyTheme() {
  const s = getSettings();
  document.title = s.site; $("#bootTitle").textContent = s.site;
  const d = $("#desktop").style;
  d.background = s.bgMode === "color" ? s.bgColor
    : s.bgMode === "link" && s.bgLink ? `url("${s.bgLink}") center/cover no-repeat, var(--bg)`
    : "radial-gradient(ellipse at 70% 40%,rgba(80,190,255,.55),transparent 55%),linear-gradient(135deg,#031a3a,#0a4a96 55%,#1688d9)";
}

// ===================== TASKBAR + START MENU =====================
[[STORE, "store"], [UPDATES, "updates"], [SETTINGS, "settings"]].forEach(([app, cls]) => {
  const t = document.createElement("div");
  t.className = "sys " + cls; t.title = app.name; t.textContent = app.icon;
  t.onclick = () => openApp(app);
  $("#sys").appendChild(t);
});

const start = $("#start");
function toggleStart(open) {
  start.classList.toggle("open", open); $("#startBtn").classList.toggle("on", open);
  if (open) { $("#startQ").value = ""; drawStart(); $("#startQ").focus(); }
}
$("#startBtn").onclick = e => { e.stopPropagation(); toggleStart(!start.classList.contains("open")); };
$("#searchBtn").onclick = e => { e.stopPropagation(); toggleStart(true); };
document.addEventListener("click", e => { if (!start.contains(e.target) && start.classList.contains("open")) toggleStart(false); });
$("#startQ").oninput = drawStart;
function drawStart() {
  const t = $("#startQ").value.toLowerCase().trim();
  const list = catalog.filter(a => !t || a.name.toLowerCase().includes(t)).sort((a, b) => a.name.localeCompare(b.name));
  const box = $("#startList"); box.innerHTML = "";
  let letter = "";
  list.forEach(a => {
    const L = a.name[0].toUpperCase();
    if (L !== letter) { letter = L; const h = document.createElement("div"); h.className = "st-h"; h.textContent = /[A-Z]/.test(L) ? L : "#"; box.appendChild(h); }
    const d = document.createElement("div");
    d.className = "item";
    d.innerHTML = glyph(a, 30) + `<div style="overflow:hidden"><b>${esc(a.name)}</b></div>`;
    d.onclick = () => { openApp(a); toggleStart(false); };
    box.appendChild(d);
  });
  const tiles = $("#tiles"); tiles.innerHTML = "";
  installed().map(k => catalog.find(a => key(a) === k)).filter(Boolean).forEach(a => {
    const [bg, fg] = solid(a);
    const d = document.createElement("div");
    d.className = "tile"; d.style.background = bg; d.style.color = fg;
    d.innerHTML = `<span class="ti">${esc(a.icon || a.name.slice(0, 2).toUpperCase())}</span><span class="tn">${esc(a.name)}</span>`;
    d.onclick = () => { openApp(a); toggleStart(false); };
    tiles.appendChild(d);
  });
}

function tick() { const d = new Date(); $("#ck1").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); $("#ck2").textContent = d.toLocaleDateString(); }
setInterval(tick, 15000); tick();

// ===================== BOOT =====================
applyTheme();
const minBoot = new Promise(r => setTimeout(r, 1800));
Promise.all([loadCatalog(), minBoot]).then(() => {
  if (!LS("seeded", false)) {
    save("installed", SEED.map(nm => catalog.find(a => a.name === nm)).filter(Boolean).map(key));
    save("seeded", true);
  }
  renderIcons();
  autoUpdate(); // background; skipped when auto update is off
  $("#boot").classList.add("hide");
  setTimeout(() => $("#boot").remove(), 550);
});
</script>
</body>
</html>
